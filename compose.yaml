name: cafe-madurez
services:
  app:
    image: cafe-madurez:v1
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8765}:8765"
    environment:
      CAFE_DEPLOYMENT: server
    mem_limit: ${APP_MEMORY_LIMIT:-4g}
    cpus: ${APP_CPUS:-2.0}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
